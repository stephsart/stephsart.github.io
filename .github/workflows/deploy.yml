name: Build, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; only the deploy job may publish.
permissions:
  contents: read

# One queue per branch or pull request. A newer push replaces an older run of
# the same pull request, but nothing cancels a deploy from main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    # Pinned so a new runner image cannot break the browser install unannounced,
    # as happened when ubuntu-latest moved to 26.04. Raise it deliberately.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - run: npm test

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
